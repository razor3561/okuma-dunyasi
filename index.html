<style>
/* Yerleşim: tek sütunlu oyun ekranı; gökyüzü üstte, çimen-toprak zemin altta, taş envanter panelleri ortada. */
:root {

/* Bloklar ve paneller */

.btn-wood { background: var(--wood); color: #fff; text-shadow: 2px 2px 0 var(--wood-d); box-shadow: inset 3px 3px 0 var(--wood-l), inset -3px -4px 0 var(--wood-d); }

.wrap { flex-wrap: wrap; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.center { text-align: center; justify-content: center; }
.muted { color: var(--muted); }
.ui { font-family: var(--f-ui); }

/* Üst çubuk */

.screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }

.hero { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; }

@keyframes bob { 50% { transform: translateY(-4px); } }
.biome { position: relative; border: 3px solid var(--ink); padding: 14px; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.45); background-size: 48px 48px; image-rendering: pixelated; }
.biome h2 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; opacity: .95; }
.biome .big { font-family: var(--f-ui); font-size: 28px; line-height: 1.1; margin: 4px 0 12px; }
.biome .btn { width: 100%; font-size: 24px; min-height: 68px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 118px; border: 3px solid var(--ink);
  color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.55); font-family: var(--f-ui); font-size: 18px; font-weight: 700; background-size: 48px 48px; image-rendering: pixelated;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), inset 0 -6px 0 rgba(0,0,0,.25); padding: 8px; text-align: center; }
.tile img { width: 52px; height: 52px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
.tile .lock .lockinfo { font-size: 13px; background: rgba(0,0,0,.45); padding: 1px 6px; }
.tile .lock { position: absolute; inset: 0; background: rgba(20,20,28,.62); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; padding: 8px; }
.tile .lock b { font-size: 26px; }
.biomes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.biomes .b { flex: 0 0 auto; width: 74px; text-align: center; font-family: var(--f-ui); font-size: 12px; }
.biomes .b .sq { width: 74px; height: 56px; border: 3px solid var(--ink); background-size: 32px 32px; image-rendering: pixelated; position: relative; }
.biomes .b.off .sq::after { content: ''; position: absolute; inset: 0; background: rgba(20,20,28,.6); }
.biomes .b.here .sq { outline: 3px solid var(--gold); outline-offset: 2px; }
.ground { height: 22px; flex: 0 0 auto; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background-size: 22px 22px; image-rendering: pixelated; border-top: 3px solid var(--grass-d); }

/* Etkinlik ekranı */
.taskhead { display: flex; align-items: center; gap: 8px; }
.prog { flex: 1; display: flex; gap: 3px; min-width: 0; }
.prog i { flex: 1; height: 16px; border: 2px solid var(--ink); background: var(--stone-m); }
.prog i.done { background: var(--grass); }
.prog i.now { background: var(--gold); }
.prompt { display: flex; gap: 10px; align-items: center; }
.prompt .say { font-family: var(--f-ui); font-size: 19px; font-weight: 500; line-height: 1.25; }
.card { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.read { font-family: var(--f-read); font-weight: 400; color: var(--ink); line-height: 1.15; word-break: break-word; }

.opts { display: grid; gap: 10px; }
.opts.c2 { grid-template-columns: 1fr 1fr; }
.opts.c3 { grid-template-columns: repeat(3, 1fr); }
.opts.c4 { grid-template-columns: 1fr 1fr; }
.opt { min-height: 84px; border: 3px solid var(--ink); background: var(--paper); font-family: var(--f-read); font-size: clamp(30px, 9vw, 46px); display: flex; align-items: center; justify-content: center; padding: 8px;
  box-shadow: inset 0 -5px 0 #e3ddc6; transition: transform .08s; }
.opt img { width: min(100%, 92px); height: auto; aspect-ratio: 1; max-width: 100%; }

.tilebtn { min-width: 60px; height: 64px; padding: 0 12px; border: 3px solid var(--ink); background: var(--wood-l); font-family: var(--f-read); font-size: 36px; box-shadow: inset 3px 3px 0 #f0c58e, inset -3px -4px 0 var(--wood-d); touch-action: none; user-select: none; }
.tilebtn.used { visibility: hidden; }
.tilebtn.ghost { position: fixed; pointer-events: none; z-index: 50; opacity: .9; transform: translate(-50%, -50%) scale(1.08); }
.arrow { font-family: var(--f-ui); font-size: 30px; }
.grid-ore { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.ore { aspect-ratio: 1; border: 3px solid var(--ink); background-size: cover; image-rendering: pixelated; font-family: var(--f-read); font-size: clamp(28px, 9vw, 42px); color: var(--ink);
  display: flex; align-items: center; justify-content: center; text-shadow: 0 0 6px #fff, 0 0 2px #fff; max-width: 100%; }

.trace .line { stroke: #7aa7d8; stroke-width: 1.5; }
.trace .line.mid { stroke-dasharray: 6 6; }
.trace .ink { fill: none; stroke: #2a55a8; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

/* Okuma metni */

/* Ebeveyn raporu. Görselden tanıma, harf tanıma, hece okuma, kelime çözme ve anlama ayrı ölçütlerdir. */

  'use strict';
  var isNode = typeof module !== 'undefined' && module.exports;
  var Motor = isNode ? require('./engine.js') : root.Motor;
  var Kayit = isNode ? require('./store.js') : root.Kayit;
  var Etkinlik = isNode ? require('./tasks.js') : root.Etkinlik;

  function rate(o) { return o && o.t ? o.c / o.t : null; }
  function sumDays(gunler, fromDay) {
    var c = 0, t = 0;
    Object.keys(gunler || {}).forEach(function (d) { if (!fromDay || d >= fromDay) { c += gunler[d].c; t += gunler[d].t; } });
    return { c: c, t: t };
  }

  function build(engine, state, now) {
    now = now || Date.now();
    var rules = engine.rules;
    var pools = engine.pools(state, now);
    var weekAgo = Kayit.today(now - 6 * 86400000);
    var st = state.istatistik;

    var beceri = Object.keys(Etkinlik.BECERI_ADLARI).map(function (k) {
      var all = sumDays(st.beceri[k] && st.beceri[k].gunler);
      var week = sumDays(st.beceri[k] && st.beceri[k].gunler, weekAgo);
      return { id: k, ad: Etkinlik.BECERI_ADLARI[k], toplam: all, hafta: week, oran: rate(all), haftaOran: rate(week) };
    });

    var harfler = pools.bilinen.map(function (l) {
      var m = Motor.letterMastery(st.harf[l], rules);
      var info = state.harfler[l] || {};
      return { harf: l, tarih: info.tarih || '', yeni: engine.isLetterNew(l, state, now), pekisti: m.pekisti, deneme: m.deneme, oran: m.oran, gun: m.gun };
    });

    var oge = st.oge;
    var hece = Object.keys(oge).filter(function (k) { return k.indexOf('h:') === 0; }).map(function (k) {
      var s = oge[k];
      var c = 0, t = 0;
      Object.keys(s).forEach(function (sk) { c += s[sk].c; t += s[sk].t; });
      return { hece: k.slice(2), c: c, t: t };
    });
    var ogrenilenHece = hece.filter(function (h) { return h.c >= 2 && h.c / h.t >= 0.7; }).map(function (h) { return h.hece; });

    function wordStat(key, skill) { return oge['w:' + key] && oge['w:' + key][skill]; }
    function solidDays(s) { return s ? Object.keys(s.gunler).filter(function (d) { return s.gunler[d] > 0; }).length : 0; }

    var okunabilen = [], zorlanilan = [], resimdenTaniyor = [];
    engine.words.forEach(function (w) {

      var oral = wordStat(w.key, 'bagimsiz_okuma');
      var pic = wordStat(w.key, 'gorselden_tanima');
      var good = (dec ? dec.c - dec.destek : 0) + (oral ? oral.c : 0);
      var days = Math.max(solidDays(dec), solidDays(oral));

      var tot = (dec ? dec.t : 0) + (oral ? oral.t : 0);
      var err = (dec ? dec.hata : 0) + (oral ? oral.hata : 0);
      if (err >= 2 && tot && (tot - err) / tot < 0.6) zorlanilan.push({ w: w.w, hata: err, deneme: tot });

        var decTot = (dec ? dec.t : 0) + (oral ? oral.t : 0);
        var decOk = (dec ? dec.c : 0) + (oral ? oral.c : 0);
        if (decTot >= 1 && decOk / decTot < 0.5) resimdenTaniyor.push(w.w);
      }

    var tekrar = [];
    harfler.forEach(function (h) { if (!h.pekisti) tekrar.push({ tur: 'harf', ad: h.harf, neden: h.deneme < rules.pekismeEnAzDeneme ? 'henüz az çalışıldı' : 'farklı günlerde tekrar gerekiyor' }); });

      var s = oge[k];

        var x = s[sk];
        if (x.t >= 2 && x.c / x.t < 0.7) tekrar.push({ tur: k.charAt(0) === 'h' ? 'hece' : k.charAt(0) === 'c' ? 'cümle' : k.charAt(0) === 'm' ? 'metin' : k.charAt(0) === 'l' ? 'harf' : 'kelime', ad: k.slice(2), neden: Etkinlik.BECERI_ADLARI[sk] || sk });

    var hafta = Object.keys(gunluk).reduce(function (a, d) { return a + gunluk[d]; }, 0);

    var anlama = beceri.filter(function (b) { return b.id === 'anlama'; })[0];
    var bag = beceri.filter(function (b) { return b.id === 'bagimsiz_okuma'; })[0];
    var birles = beceri.filter(function (b) { return b.id === 'hece_birlestirme'; })[0];

    return {
      harfler: harfler,
      siradaki: pools.siradaki,
      ogrenilenHece: ogrenilenHece,
      heceHavuzu: pools.hece.map(function (h) { return h.hece; }),

  }

  /* ================= ETKİNLİK AKIŞI ================= */
  function startRun(tur, steps, quest) {
    A.gen.refresh();
    A.gen.used = {};
    var ses = A.store.startSession();
    ses.tur = tur; A.store.save();
    A.run = { tur: tur, steps: steps.map(function (s) { return typeof s === 'string' ? { kind: s } : s; }), i: 0, ok: 0, total: 0, kazanc: {}, yeniEsya: [], quest: quest || null, zor: [], beceri: {} };
    nextTask();
  }

  function nextTask() {
    var R = A.run;
    A.gen.refresh();
    while (R.i < R.steps.length) {
      var s = R.steps[R.i];
      var t = A.gen.make(s.kind, s.opt);
      if (t) { R.task = t; return renderTask(t); }
      R.i++;
    }
    endRun();
  }

  function finishTask(t, dogru, extra) {
    extra = extra || {};
    var R = A.run;
    if (t._kaydedildi) return;
    t._kaydedildi = true;
    A.store.record({ beceri: t.beceri, oge: t.oge, dogru: dogru, harfler: t.harfler, destek: !!extra.destek });
    A.store.countTask(dogru);
    R.total++; if (dogru) R.ok++;
    R.beceri[t.beceri] = R.beceri[t.beceri] || { c: 0, t: 0 };
    R.beceri[t.beceri].t++; if (dogru) R.beceri[t.beceri].c++;
    if (!dogru && (t.kelime || t.cumle)) R.zor.push((t.kelime && t.kelime.w) || (t.cumle && t.cumle.s));
    var kind = t.odul || 'komur';
    if (dogru || extra.emek) { A.store.reward(kind, 1); R.kazanc[kind] = (R.kazanc[kind] || 0) + 1; }
    if (dogru && t.esya && t.kelime && !extra.destek) {
      var stg = A.engine.wordStatus(t.kelime, A.store.state).stage;
      if (stg === 'bagimsiz' && A.store.addItem(t.kelime.key)) { R.yeniEsya.push(t.kelime); toast('Envantere eklendi: ' + t.kelime.w, t.kelime.img); }
    }
  }

  function goNext() { Ses.stop(); A.run.i++; nextTask(); }

      h('div', { class: 'taskhead' },

      bodyNode, fb);
    mount(h('div', { style: { display: 'contents' } }, screen, ground()), 'etkinlik');
    setTimeout(function () { Ses.speak(t.soz); }, 250);

  }

  var OVGU = ['Harika!', 'Süper!', 'Aferin!', 'Çok güzel!', 'Bravo!', 'Tam isabet!'];
  var NAZIK = ['Bir daha bakalım.', 'Neredeyse! Tekrar dene.', 'Yavaşça bir daha oku.'];
  function praise() { return OVGU[Math.floor(Math.random() * OVGU.length)]; }

  /* Çoktan seçmeli etkinlikler için ortak davranış: ilk deneme ölçülür, hata cezalandırılmaz, ikinci hatadan sonra doğru gösterilir. */
  function choiceGrid(t, opts, cols, onCorrect, isRight) {
    var tries = 0;
    var fb;
    var grid = h('div', { class: 'opts ' + cols });
    var done = false;
    opts.forEach(function (o) {
      var b = h('button', { class: 'opt', 'aria-label': o.text || o.ad || 'resim', 'data-id': o.id },
        o.img ? pic(o.img, 96) : h('span', { text: o.text }));
      b.addEventListener('click', function () {
        if (done) return;
        if (t.adSoyle && o.ad && !b.classList.contains('spoken')) { /* adı söyle, seçmek için ikinci dokunuş */ }
        var right = isRight ? isRight(o) : o.id === t.dogru;
        if (right) {
          done = true;
          b.classList.add('right');
          Sfx.good();
          finishTask(t, tries === 0, {});
          onCorrect(b, o, tries, function (msg, sprite) { showFeedback(fb, 'good', msg || praise(), sprite || 'elmas', goNext); });
        } else {
          tries++;
          b.classList.add('wrong'); setTimeout(function () { b.classList.remove('wrong'); }, 400);
          Sfx.soft();
          if (tries >= 2) {
            done = true;
            finishTask(t, false, { emek: true });
            var rightBtn = grid.querySelector('[data-id="' + cssEsc(t.dogru) + '"]');
            if (rightBtn) rightBtn.classList.add('hint');
            var ans = t.cevapKelime || (t.kelime && t.kelime.w) || '';
            Ses.speak('Doğrusu bu. ' + ans);
            showFeedback(fb, 'soft', 'Doğrusu sarı çerçevede. Birlikte bakalım.', 'mesale', goNext);
          } else { Ses.speak(gentle()); }
        }
      });
      grid.appendChild(b);
    });
    return { node: grid, setFb: function (f) { fb = f; } };
  }
  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  /* ---------------- Etkinlik çizimleri ---------------- */

  /* ---------- Üretim masası: harf/hece/kelime parçalarını sırala ---------- */
  function builder(opts) {
    /* opts: tiles [{id,text}], slot n, check(str) → bool, onDone(correctFirst), sep, onFill */
    var placed = []; for (var pi = 0; pi < opts.slot; pi++) placed.push(null);
    var slotsEl = h('div', { class: 'slots' });
    var bank = h('div', { class: 'bank' });
    var tileEls = {};
    var attempts = 0, finished = false;
    function draw() {
      slotsEl.innerHTML = '';
      for (var i = 0; i < opts.slot; i++) (function (i) {
        var tl = placed[i];
        var s = h('button', { class: 'slot' + (tl ? ' filled' : ''), 'data-slot': i, 'aria-label': tl ? tl.text + ' kaldır' : 'boş yuva ' + (i + 1),
          onclick: function () { if (finished || !placed[i]) return; tileEls[placed[i].id].classList.remove('used'); placed[i] = null; draw(); } }, tl ? tl.text : '');
        if (opts.wide) s.style.minWidth = '84px';
        slotsEl.appendChild(s);
      })(i);
      if (opts.tail) slotsEl.appendChild(h('span', { class: 'read md', text: opts.tail }));
    }
    function put(tl, at) {
      if (finished) return;
      var idx = at !== undefined && !placed[at] ? at : placed.findIndex(function (x) { return !x; });
      if (idx === -1 || idx === undefined) return;
      placed[idx] = tl; tileEls[tl.id].classList.add('used'); Sfx.dig(); draw(); check();
    }
    function check() {
      if (placed.some(function (x) { return !x; })) return;
      var s = placed.map(function (x) { return x.text; }).join(opts.joiner === undefined ? '' : opts.joiner);
      if (opts.check(s)) { finished = true; opts.onDone(attempts === 0); }
      else {
        attempts++;
        Sfx.soft();
        slotsEl.classList.add('wrong'); slotsEl.style.animation = 'shake .35s'; setTimeout(function () { slotsEl.style.animation = ''; }, 400);
        if (attempts >= 2 && opts.onGiveUp) { finished = true; opts.onGiveUp(); return; }
        Ses.speak('Sıralamayı bir daha dene.');
        setTimeout(function () { placed.forEach(function (x, i) { if (x) { tileEls[x.id].classList.remove('used'); placed[i] = null; } }); draw(); }, 700);
      }
    }
    opts.tiles.forEach(function (tl) {
      var b = h('button', { class: 'tilebtn', 'aria-label': tl.text }, tl.text);
      tileEls[tl.id] = b;
      enableDrag(b, function (slotIdx) { put(tl, slotIdx); });
      bank.appendChild(b);
    });
    draw();
    return { slots: slotsEl, bank: bank, placed: placed };
  }

  /* Sürükle-bırak; dokunup bırakınca yerleştirme de çalışır */
  function enableDrag(el, onDrop) {
    var start = null, ghost = null, moved = false;
    el.addEventListener('pointerdown', function (e) {
      if (el.classList.contains('used')) return;
      start = { x: e.clientX, y: e.clientY }; moved = false;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* yoksay */ }
    });
    el.addEventListener('pointermove', function (e) {
      if (!start) return;
      if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
        moved = true;
        ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost);
      }
      if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
    });
    function end(e) {
      if (!start) return;
      var wasMoved = moved;
      start = null;
      if (ghost) { ghost.remove(); ghost = null; }
      if (wasMoved) {
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var slot = under && under.closest && under.closest('[data-slot]');
        if (slot) onDrop(Number(slot.getAttribute('data-slot')));
      } else if (e.type === 'pointerup') onDrop(undefined);
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDrop(undefined); } });
  }

  /* ---------- Harf iz sürme ---------- */
  RENDER.harf_iz = function (t) {
    var ch = t.hedefMetin;
    var L = Harfler.get(ch);
    var NS = 'http://www.w3.org/2000/svg';
    var W = Math.max(L.w + 60, 150);
    var x0 = -(W - L.w) / 2;
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', x0 + ' -32 ' + W + ' 190');
    svg.setAttribute('class', 'trace');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', ch + ' harfini yazma alanı');
    function el(tag, attrs) { var e = document.createElementNS(NS, tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); svg.appendChild(e); return e; }
    [0, 50, 100].forEach(function (y) { el('line', { x1: x0, x2: x0 + W, y1: y, y2: y, class: 'line' + (y === 50 ? ' mid' : '') }); });
    var guides = L.s.map(function (d) { return el('path', { d: d, class: 'guide', style: t.serbest ? 'display:none' : '' }); });
    if (!t.serbest) guides.forEach(function (g) { var p = g.getPointAtLength(0); el('circle', { cx: p.x, cy: p.y, r: 7, class: 'start' }); });
    var inkLayer = document.createElementNS(NS, 'g'); svg.appendChild(inkLayer);
    var strokes = [], cur = null;
    function toSvg(e) {
      var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      var m = svg.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 };
    }
    svg.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* yoksay */ }
      var p = toSvg(e);
      cur = { pts: [p], node: document.createElementNS(NS, 'polyline') };
      cur.node.setAttribute('class', 'ink'); inkLayer.appendChild(cur.node);
      cur.node.setAttribute('points', p.x + ',' + p.y);
    });
    svg.addEventListener('pointermove', function (e) {
      if (!cur) return;
      var p = toSvg(e); cur.pts.push(p);
      cur.node.setAttribute('points', cur.pts.map(function (q) { return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' '));
    });
    function up() { if (cur) { strokes.push(cur.pts); cur = null; } }
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);

    function score() {
      var samples = [];
      guides.forEach(function (g) {
        var len = g.getTotalLength(); var n = Math.max(8, Math.round(len / 6));
        for (var i = 0; i <= n; i++) samples.push(g.getPointAtLength(len * i / n));
      });
      var ink = []; strokes.forEach(function (s) { ink = ink.concat(s); });
      if (ink.length < 4) return { ok: false, cov: 0, prec: 0 };
      function near(p, arr, tol) { for (var i = 0; i < arr.length; i++) { var dx = arr[i].x - p.x, dy = arr[i].y - p.y; if (dx * dx + dy * dy <= tol * tol) return true; } return false; }
      var cov = samples.filter(function (p) { return near(p, ink, 15); }).length / samples.length;
      var prec = ink.filter(function (p) { return near(p, samples, 22); }).length / ink.length;
      var need = t.serbest ? 0.7 : 0.8;
      return { ok: cov >= need && prec >= 0.7, cov: cov, prec: prec };
    }
    var attempts = 0, fb;
    function clearInk() { strokes = []; inkLayer.innerHTML = ''; }
    function demo() {
      var dot = el('circle', { r: 7, class: 'demo' });
      var gi = 0, t0 = null;
      function step(ts) {
        if (!t0) t0 = ts;
        var g = guides[gi]; var len = g.getTotalLength(); var dur = Math.max(700, len * 6);
        var k = Math.min(1, (ts - t0) / dur); var p = g.getPointAtLength(len * k);
        dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
        if (k < 1) requestAnimationFrame(step);
        else if (++gi < guides.length) { t0 = null; requestAnimationFrame(step); }
        else setTimeout(function () { dot.remove(); }, 300);
      }
      requestAnimationFrame(step);
    }
    var tools = h('div', { class: 'row center wrap' },
      h('button', { class: 'btn btn-small', onclick: clearInk }, 'Sil'),
      t.serbest ? null : h('button', { class: 'btn btn-small btn-wood', onclick: demo }, 'Nasıl yazılır?'),
      h('button', { class: 'btn btn-small btn-grass', onclick: function () {
        var r = score();
        if (r.ok) {
          finishTask(t, attempts === 0, {}); Sfx.good();
          showFeedback(fb, 'good', praise() + ' Harfi güzel yazdın.', 'kalem', goNext);
        } else {
          attempts++; Sfx.soft();
          if (attempts >= 3) { finishTask(t, false, { emek: true }); showFeedback(fb, 'soft', 'Çok çalıştın! Defterinde de deneyelim.', 'kalem', goNext); }
          else { Ses.speak(r.cov < 0.5 ? 'Harfin tamamının üzerinden geç.' : 'Çizginin üzerinde kalmaya çalış.'); demo(); clearInk(); }
        }
      } }, 'Bitti'));
    var box = h('div', { class: 'paper card' }, h('div', { class: 'read lg', text: ch }), svg, tools);
    fb = taskFrame(t, h('div', { class: 'stack' }, box));
    if (!t.serbest) setTimeout(demo, 900);
  };
